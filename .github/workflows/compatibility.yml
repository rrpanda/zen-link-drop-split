name: Compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [bce6a23ea7082967bc27a92ae8613a4b04f3dae3, dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:native
        env:
          ZEN_SPLITTER_REF: ${{ matrix.ref }}
